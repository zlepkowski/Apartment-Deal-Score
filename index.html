<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DealScore — NYC apartments scored by value</title>
    <meta name="description" content="Apartment hunting with a Deal Score: every New York City listing rated 0–100 on value versus StreetEasy's median asking rent for its neighborhood and size." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Expose the design tokens in assets/css/styles.css to Tailwind.
      // Guarded so a failed CDN load doesn't also throw here.
      if (window.tailwind) tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: { DEFAULT: 'var(--accent)', hover: 'var(--accent-hover)', soft: 'var(--accent-soft)' },
            },
          },
        },
      };
    </script>
    <!-- Self-hosted: Leaflet 1.9.4 (BSD-2-Clause) for the map; Inter is loaded by styles.css. -->
    <link rel="stylesheet" href="./assets/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="min-h-screen antialiased">
    <a class="skip-link" href="#app" data-skip-link>Skip to content</a>
    <div id="app-header"></div>
    <main id="app" tabindex="-1" class="focus:outline-none"></main>
    <footer class="mx-auto max-w-6xl px-4 py-10 text-center text-xs text-slate-600">
      <p>
        DealScore scores NYC apartments against market data from the
        <a class="underline hover:text-slate-900" href="https://streeteasy.com/blog/data-dashboard" target="_blank" rel="noopener">StreetEasy Data Dashboard</a>.
        Not affiliated with StreetEasy.
      </p>
      <nav aria-label="Legal" class="mt-2 flex justify-center gap-2">
        <a class="inline-block px-1 py-1 underline hover:text-slate-900" href="#/privacy">Privacy</a>
        <a class="inline-block px-1 py-1 underline hover:text-slate-900" href="#/terms">Terms</a>
      </nav>
    </footer>

    <!-- Bundled classic script so the site also works from file://.
         Edit sources under assets/js/ and run `node build.mjs` to regenerate. -->
    <script src="./assets/vendor/leaflet/leaflet.js"></script>
    <script src="./dist/dealscore.js"></script>
  </body>
</html>
