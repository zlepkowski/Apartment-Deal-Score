<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DealScore — NYC apartments scored by value</title>
    <meta name="description" content="Apartment hunting with a Deal Score: every New York City listing rated 0–100 on value versus StreetEasy's median asking rent for its neighborhood and size." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Leaflet for the listings map (OpenStreetMap tiles, no API key). -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
    <div id="app-header"></div>
    <main id="app"></main>
    <footer class="mx-auto max-w-6xl px-4 py-10 text-center text-xs text-slate-400">
      DealScore — NYC apartments scored against market data from the <a class="underline hover:text-slate-600" href="https://streeteasy.com/blog/data-dashboard" target="_blank" rel="noopener">StreetEasy Data Dashboard</a>. Not affiliated with StreetEasy.
    </footer>

    <!-- Bundled classic script so the site also works from file://.
         Edit sources under assets/js/ and run `node build.mjs` to regenerate. -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./dist/dealscore.js"></script>
  </body>
</html>
